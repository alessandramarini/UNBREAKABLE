            phase0: [
              { id: 'p0_m1', timeId: 'morning', name: 'Coral-Mine (Acqua)', dose: '1.5L', note: t.p0m1Note, rationale: t.p0m1Rat },
              { id: 'p0_m2', timeId: 'morning', name: 'H-500', dose: '1 caps', note: t.p0m2Note, rationale: t.p0m2Rat },
              { id: 'p0_m3', timeId: 'morning', name: 'Coral Lecithin', dose: '2 caps', note: t.p0m3Note, rationale: t.p0m3Rat },
              { id: 'p0_m4', timeId: 'morning', name: 'Assimilator', dose: '1 caps', note: t.nMeal, rationale: t.p0m4Rat },
              { id: 'p0_s1', timeId: 'evening', name: 'H-500', dose: '1 caps', note: t.p0s1Note, rationale: t.p0s1Rat },
              { id: 'p0_s2', timeId: 'evening', name: 'Coral Lecithin', dose: '2 caps', note: t.p0s2Note, rationale: t.p0s2Rat },
              { id: 'p0_s3', timeId: 'evening', name: 'Super-Flora', dose: '1 caps', note: t.nBed, rationale: t.p0s3Rat }
            ],
            phase1: BASE_PROTOCOL_OSSEO,
            phase2: [
              ...BASE_PROTOCOL_OSSEO,
              { id: 'w1', timeId: 'midday', name: t.w1Name, dose: t.w1Dose, note: t.w1Note, rationale: t.w1Rat }
            ],
            phase3: [
              ...BASE_PROTOCOL_OSSEO,
              { id: 'w1', timeId: 'midday', name: t.w2Name, dose: t.w2Dose, note: t.w2Note, rationale: t.w2Rat }
            ]
          };
        };

        const getLocalTodayStr = () => {
          const d = new Date();
          const year = d.getFullYear();
          const month = String(d.getMonth() + 1).padStart(2, '0');
          const day = String(d.getDate()).padStart(2, '0');
          return `${year}-${month}-${day}`;
        };

        const parseLocalDate = (dateStr) => {
          const [y, m, d] = dateStr.split('-');
          return new Date(y, m - 1, d);
        };

        const getRelativeDayName = (dateStr, todayStr, t) => {
          if (dateStr === todayStr) return t.today;
          const d = parseLocalDate(dateStr);
          const tD = parseLocalDate(todayStr);
          const diffTime = Math.round((tD - d) / (1000 * 60 * 60 * 24));
          if (diffTime === 1) return t.yesterday;
          if (diffTime === -1) return t.tomorrow;
          return d.toLocaleDateString(t.locale, { day: '2-digit', month: 'short' });
        };

        const getDayNumber = (startStr, currentStr) => {
          if (!startStr || !currentStr) return 1;
          const start = parseLocalDate(startStr);
          const current = parseLocalDate(currentStr);
          const diffDays = Math.floor((current - start) / (1000 * 60 * 60 * 24));
          return diffDays >= 0 ? diffDays + 1 : 1;
        };

        const changeDay = (dateStr, offset) => {
          const d = parseLocalDate(dateStr);
          d.setDate(d.getDate() + offset);
          const year = d.getFullYear();
          const month = String(d.getMonth() + 1).padStart(2, '0');
          const day = String(d.getDate()).padStart(2, '0');
          return `${year}-${month}-${day}`;
        };

        function IconSun({ className }) { return <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2m-7.07-7.07 1.41 1.41m12.72 12.72 1.41 1.41M2 12h2m16 0h2m-5.66 5.66-1.41 1.41M4.93 4.93 3.52 3.52" /></svg>; }
        function IconMoon({ className }) { return <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></svg>; }
        function IconSunMedium({ className }) { return <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="5" /><line x1="12" y1="1" x2="12" y2="3" /><line x1="12" y1="21" x2="12" y2="23" /><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" /><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" /><line x1="1" y1="12" x2="3" y2="12" /><line x1="21" y1="12" x2="23" y2="12" /><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" /><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" /></svg>; }

        function SectionIcon({ iconType }) {
          if (iconType === 'sun') return <IconSun className="w-5 h-5 text-amber-500" />;
          if (iconType === 'sunMedium') return <IconSunMedium className="w-5 h-5 text-amber-500/80" />;
          if (iconType === 'moon') return <IconMoon className="w-5 h-5 text-slate-400" />;
          return null;
        }

        const LANGUAGES = [
          { code: 'en', flag: 'gb' },
          { code: 'it', flag: 'it' },
          { code: 'fr', flag: 'fr' },
          { code: 'de', flag: 'de' },
          { code: 'es', flag: 'es' },
          { code: 'pt', flag: 'pt' },
          { code: 'pl', flag: 'pl' },
          { code: 'ja', flag: 'jp' }
        ];

        const LanguageSelector = ({ currentLang, onLangChange }) => (
          <div className="flex items-center gap-3 overflow-x-auto scrollbar-hide py-3 px-1 w-full justify-start md:justify-center">
            {LANGUAGES.map((l) => {
              const isSelected = currentLang === l.code;
              return (
                <button
                  key={l.code}
                  onClick={() => onLangChange(l.code)}
                  className={`relative flex-shrink-0 transition-all duration-300 rounded-[4px] outline-none cursor-pointer
                    ${isSelected 
                      ? 'ring-[2.5px] ring-amber-500 ring-offset-[3px] ring-offset-slate-950 shadow-[0_0_15px_rgba(245,158,11,0.7)] scale-[1.15] z-10 opacity-100' 
                      : 'opacity-40 hover:opacity-100 hover:scale-110'
                    }`}
                >
                  <img
                    src={`https://flagcdn.com/w40/${l.flag}.png`}
                    srcSet={`https://flagcdn.com/w80/${l.flag}.png 2x`}
                    className="w-[28px] h-[20px] object-cover rounded-[2px] block"
                    alt={l.code}
                    loading="lazy"
                  />
                </button>
              );
            })}
          </div>
        );

        function CoralApp() {
          const [profile, setProfile] = useState(null); 
          const [isLoading, setIsLoading] = useState(true);
          const [activeTab, setActiveTab] = useState('tracker'); 
          
          const [lang, setLang] = useState(() => {
            try {
              if (typeof window !== 'undefined' && window.localStorage) {
                return localStorage.getItem('osteo_lang') || 'it';
              }
            } catch(e) {}
            return 'it';
          });
          
          const [realToday, setRealToday] = useState(getLocalTodayStr());
          const [selectedDate, setSelectedDate] = useState(getLocalTodayStr());
          const [dailyProgress, setDailyProgress] = useState({});
          const [expandedInfo, setExpandedInfo] = useState(null);

          const handleLangChange = (newLang) => {
            setLang(newLang);
            try {
              if (typeof window !== 'undefined' && window.localStorage) {
                localStorage.setItem('osteo_lang', newLang);
              }
            } catch(e) {}
          };

          const t = translations[lang] || translations.it;
          const WEEKLY_PHASES = getPhasesData(t);
          const DYNAMIC_PROTOCOLS = getProtocolsData(lang);

          // Midnight checker
          useEffect(() => {
            const midnightChecker = setInterval(() => {
              const todayNow = getLocalTodayStr();
              setRealToday(prev => {
                if (prev !== todayNow) { setSelectedDate(todayNow); return todayNow; }
                return prev;
              });
            }, 30000);
            return () => clearInterval(midnightChecker);
          }, []);

          // Load Profile from LocalStorage
          useEffect(() => {
            try {
              const savedProfile = localStorage.getItem('unbreakable_profile');
              if (savedProfile) {
                setProfile({ ...JSON.parse(savedProfile), isNew: false });
              } else {
                setProfile({ isNew: true });
              }
            } catch(e) { 
              setProfile({ isNew: true }); 
            }
            setIsLoading(false);
          }, []);

          // Load Daily Progress from LocalStorage whenever selectedDate changes
          useEffect(() => {
            if (!profile || profile.isNew) { 
              setDailyProgress({}); 
              return; 
            }
            try {
              const savedProg = localStorage.getItem(`unbreakable_prog_${selectedDate}`);
              setDailyProgress(savedProg ? JSON.parse(savedProg) : {});
            } catch(e) { 
              setDailyProgress({}); 
            }
          }, [profile, selectedDate]);

          const handleSelectPhase = (phaseId) => {
            const newStartDate = getLocalTodayStr();
            const newProfile = { currentPhase: phaseId, startDate: newStartDate, isNew: false };
            setProfile(newProfile);
            try { 
              localStorage.setItem('unbreakable_profile', JSON.stringify(newProfile)); 
            } catch(e) {}
            
            setRealToday(newStartDate);
            setSelectedDate(newStartDate);
            setActiveTab('tracker');
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };

          const toggleTask = (taskId) => {
            const newState = !dailyProgress[taskId];
            const updatedProgress = { ...dailyProgress, [taskId]: newState };
            setDailyProgress(updatedProgress);
            
            try { 
              localStorage.setItem(`unbreakable_prog_${selectedDate}`, JSON.stringify(updatedProgress)); 
            } catch(e) { 
              console.error("Save to localStorage failed", e); 
            }
          };

          if (isLoading) {
            return (
              <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-4">
                <div className="w-10 h-10 border-4 border-slate-800 border-t-amber-500 rounded-full animate-spin mb-4"></div>
                <p className="text-slate-500 font-medium animate-pulse text-sm">{t.loading}</p>
              </div>
            );
          }

          if (profile?.isNew) {
            return (
              <div className="min-h-screen bg-slate-950 font-sans flex justify-center">
                <div className="w-full max-w-md relative flex flex-col pb-24 overflow-x-hidden">
                    <div className="pt-8 px-2 flex justify-center z-10 w-full">
                        <LanguageSelector currentLang={lang} onLangChange={handleLangChange} />
                    </div>
                    <div className="p-6 relative text-center pt-8">
                      <h1 className="text-3xl font-extrabold text-white tracking-tight mb-2">{t.startJourney}</h1>
                      <p className="text-slate-400 text-sm">{t.startJourneyDesc}</p>
                    </div>
                    <PhaseSelector onSelect={handleSelectPhase} currentPhaseId={null} phases={WEEKLY_PHASES} t={t} />
                    
                    <div className="fixed bottom-0 w-full max-w-md mx-auto bg-slate-950/95 backdrop-blur-md border-t border-slate-800 px-4 py-3 pb-safe z-30 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
                      <div className="flex justify-center items-center">
                        <a href="index.html" className="flex items-center gap-2 transition-all duration-300 text-slate-400 hover:text-amber-500 hover:bg-slate-900 px-6 py-3 rounded-xl border border-transparent hover:border-amber-500/30 active:scale-95 cursor-pointer no-underline">
                          <ChevronLeft className="h-5 w-5" />
                          <span className="text-[11px] font-bold tracking-wider uppercase">{t.goBack}</span>
                        </a>
                      </div>
                    </div>
                </div>
              </div>
            );
          }

          const safePhase = profile?.currentPhase || 'phase0';
          const activeProtocol = DYNAMIC_PROTOCOLS[safePhase] || [];
          const currentPhaseDetails = WEEKLY_PHASES.find(p => p.id === safePhase) || WEEKLY_PHASES[0];
          
          const dayNumber = getDayNumber(profile?.startDate, selectedDate);
          const isToday = selectedDate === realToday;
          
          const totalTasks = activeProtocol.length;
          const completedCount = activeProtocol.filter(task => dailyProgress[task.id]).length;
          const progressPercentage = totalTasks > 0 ? Math.round((completedCount / totalTasks) * 100) : 0;

          const morningTasks = activeProtocol.filter(task => task.timeId === 'morning');
          const middayTasks = activeProtocol.filter(task => task.timeId === 'midday');
          const eveningTasks = activeProtocol.filter(task => task.timeId === 'evening');

          return (
            <div className="min-h-screen bg-slate-950 text-slate-200 font-sans selection:bg-amber-500/30 flex justify-center">
              <div className="w-full max-w-md bg-slate-950 relative shadow-2xl overflow-x-hidden min-h-screen flex flex-col">
                
                <header className="pt-6 pb-2 bg-gradient-to-b from-slate-900 to-slate-950 border-b border-amber-900/30 sticky top-0 z-20 flex flex-col gap-1">
                  <div className="px-6">
                    <h1 className="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-200 to-amber-600 tracking-tighter uppercase leading-none">{t.appTitle}</h1>
                    <p className="text-slate-400 text-xs font-medium tracking-widest uppercase mt-1">{t.appSubtitle}</p>
                  </div>
                  <div className="px-4">
                    <LanguageSelector currentLang={lang} onLangChange={handleLangChange} />
                  </div>
                </header>

                <div className="px-6 pt-4 pb-2 z-10">
                    <div className="flex bg-slate-900 rounded-xl p-1 border border-slate-800 shadow-inner">
                       {['tracker', 'phases', 'manual'].map((v) => (
                         <button key={v} onClick={() => setActiveTab(v)} className={`flex-1 py-3 text-[11px] font-bold rounded-lg transition-all duration-300 uppercase ${activeTab === v ? 'bg-amber-500 text-slate-900 shadow-md shadow-amber-900/20' : 'text-slate-400 hover:text-slate-200'}`}>
                            {t[v + 'Tab']}
                         </button>
                       ))}
                    </div>
                </div>

                <main className="flex-1 pb-24">
                  {activeTab === 'tracker' && (
                    <div className="animate-in fade-in slide-in-from-bottom-4 duration-500">
                      
                      <div className="bg-slate-900 border border-slate-800 text-slate-200 shadow-inner mb-6 mx-6 rounded-xl flex items-center justify-between px-2 py-1.5">
                          <button onClick={() => setSelectedDate(changeDay(selectedDate, -1))} className="p-2 hover:bg-slate-800 rounded-lg transition-colors text-slate-400 active:scale-95">
                             <ChevronLeft className="w-5 h-5" />
                          </button>
                          <div className="text-sm font-medium flex items-center gap-2 cursor-pointer hover:text-amber-500 transition-colors" onClick={() => setSelectedDate(realToday)}>
                             {isToday && <span className="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.6)]"></span>}
                             <span className={!isToday ? 'text-slate-400' : 'font-bold text-slate-200'}>{getRelativeDayName(selectedDate, realToday, t)}</span>
                             <span className="text-slate-500 font-normal text-[10px]">({parseLocalDate(selectedDate).toLocaleDateString(t.locale, { day: '2-digit', month: '2-digit' })})</span>
                          </div>
                          <button onClick={() => setSelectedDate(changeDay(selectedDate, 1))} disabled={isToday} className={`p-2 rounded-lg transition-colors ${isToday ? 'text-slate-800 cursor-not-allowed' : 'hover:bg-slate-800 text-slate-400 active:scale-95'}`}>
                             <ChevronRight className="w-5 h-5" />
                          </button>
                      </div>

                      {!isToday && (
                        <div className="mx-6 mb-6 bg-amber-950/40 border border-amber-900/50 rounded-xl p-4 flex flex-col gap-3 shadow-inner">
                            <span className="text-xs text-amber-500 font-medium">{t.historyWarning} {parseLocalDate(selectedDate).toLocaleDateString(t.locale, { weekday: 'long', day: 'numeric', month: 'long' })}.</span>
                            <button onClick={() => setSelectedDate(realToday)} className="bg-amber-500/10 hover:bg-amber-500/20 text-amber-500 text-[10px] uppercase tracking-wider font-bold px-3 py-2 rounded-lg border border-amber-500/30 transition-colors w-full">{t.backToToday}</button>
                        </div>
                      )}

                      <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl mb-8 mx-6">
                          <div className="flex justify-between items-center mb-3">
                             <h3 className="font-bold text-slate-200 flex items-center gap-2">
                                <Target className="w-5 h-5 text-amber-500"/>
                                {currentPhaseDetails.subtitle}
                             </h3>
                             <span className="text-[9px] font-black uppercase tracking-widest bg-amber-500/10 text-amber-500 px-2 py-1 rounded-md border border-amber-500/20">{t.currentPhaseLabel}</span>
                          </div>
                          <div className="text-xs text-slate-400 space-y-2 mt-3 pt-3 border-t border-slate-800">
                             <p><span className="font-semibold text-amber-500 uppercase tracking-wider text-[10px] block mb-1">{t.objectiveLabel}</span> {currentPhaseDetails.objective}</p>
                          </div>
                          <div className="mt-4 pt-4 border-t border-slate-800 flex items-center justify-between">
                              <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">{t.day} {dayNumber}</span>
                              <span className="text-xs font-bold text-amber-500">{progressPercentage}%</span>
                          </div>
                          <div className="w-full h-2 bg-slate-800 rounded-full mt-2 overflow-hidden">
                              <div className="h-full bg-gradient-to-r from-amber-500 to-amber-400 transition-all duration-500" style={{ width: `${progressPercentage}%` }}></div>
                          </div>
                      </div>

                      <TaskSection title={t.morning} iconType="sun" tasks={morningTasks} dailyProgress={dailyProgress} toggleTask={toggleTask} expandedInfo={expandedInfo} setExpandedInfo={setExpandedInfo} t={t} />
                      <TaskSection title={t.midday} iconType="sunMedium" tasks={middayTasks} dailyProgress={dailyProgress} toggleTask={toggleTask} expandedInfo={expandedInfo} setExpandedInfo={setExpandedInfo} t={t} />
                      <TaskSection title={t.evening} iconType="moon" tasks={eveningTasks} dailyProgress={dailyProgress} toggleTask={toggleTask} expandedInfo={expandedInfo} setExpandedInfo={setExpandedInfo} t={t} />
                      
                      {progressPercentage === 100 && isToday && (
                        <div className="mx-6 mb-8 bg-emerald-950/30 border border-emerald-900/50 text-emerald-400 p-6 rounded-2xl text-center shadow-inner animate-in zoom-in duration-500">
                          <span className="text-4xl block mb-3">🏆</span>
                          <h3 className="font-black text-xl mb-1">{t.greatJob}</h3>
                          <p className="text-sm font-medium opacity-80">{t.completedAll}</p>
                        </div>
                      )}
                    </div>
                  )}

                  {activeTab === 'phases' && (
                    <div className="animate-in fade-in slide-in-from-right-4 duration-300">
                      <div className="px-6 mb-6">
                         <h2 className="text-xl font-bold text-white mb-2">{t.yourPhases}</h2>
                         <p className="text-xs text-slate-400 leading-relaxed">{t.phasesDesc}</p>
                      </div>
                      <PhaseSelector onSelect={handleSelectPhase} currentPhaseId={safePhase} phases={WEEKLY_PHASES} t={t} />
                    </div>
                  )}

                  {activeTab === 'manual' && (
                    <div className="px-6 pb-8 space-y-6 animate-in fade-in slide-in-from-right-4 duration-300">
                        <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 text-center shadow-xl">
                            <BookOpen className="w-10 h-10 mx-auto mb-3 text-amber-500" />
                            <h2 className="text-xl font-bold text-white mb-2">{t.manualTitle}</h2>
                            <p className="text-xs text-slate-400 leading-relaxed">{t.manualDesc}</p>
                        </div>
                        <div className="space-y-4">
                           <ManualSection title={t.m1Title} desc={t.m1Desc} />
                           <ManualSection title={t.m2Title} desc={t.m2Desc} />
                           <ManualSection title={t.m3Title} desc={t.m3Desc} />
                           <ManualSection title={t.m4Title} desc={t.m4Desc} />
                        </div>
                    </div>
                  )}
                </main>

                {/* Bottom Back Button updated here */}
                <div className="fixed bottom-0 w-full max-w-md mx-auto bg-slate-950/95 backdrop-blur-md border-t border-slate-800 px-4 py-3 pb-safe z-30 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
                  <div className="flex justify-center items-center">
                    <a href="index.html" className="flex items-center gap-2 transition-all duration-300 text-slate-400 hover:text-amber-500 hover:bg-slate-900 px-6 py-3 rounded-xl border border-transparent hover:border-amber-500/30 active:scale-95 cursor-pointer no-underline">
                      <ChevronLeft className="h-5 w-5" />
                      <span className="text-[11px] font-bold tracking-wider uppercase">{t.goBack}</span>
                    </a>
                  </div>
                </div>

              </div>
            </div>
          );
        }

        function ManualSection({ title, desc }) {
          return (
            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-inner">
              <h3 className="text-sm font-bold text-amber-500 mb-2">{title}</h3>
              <p className="text-xs text-slate-300 leading-relaxed">{desc}</p>
            </div>
          );
        }

        function TaskSection({ title, iconType, tasks, dailyProgress, toggleTask, expandedInfo, setExpandedInfo, t }) {
          if (!tasks || tasks.length === 0) return null;
          return (
            <section className="mb-6 px-6">
              <div className="flex items-center gap-2 mb-3">
                <SectionIcon iconType={iconType} />
                <h2 className="text-sm font-bold text-slate-200 uppercase tracking-tight">{title}</h2>
              </div>
              <div className="space-y-3">
                {tasks.map(task => (
                  <TaskRow key={task.id} task={task} checked={!!dailyProgress[task.id]} onToggle={() => toggleTask(task.id)} isExpanded={expandedInfo === task.id} onToggleInfo={() => setExpandedInfo(expandedInfo === task.id ? null : task.id)} t={t} />
                ))}
              </div>
            </section>
          );
        }

        function TaskRow({ task, checked, onToggle, isExpanded, onToggleInfo, t }) {
          const isWorkout = task.id.startsWith('w');
          return (
            <div className={`w-full text-left rounded-2xl p-4 border transition-all duration-300 ${checked ? 'bg-emerald-500/5 border-emerald-500/30' : 'bg-slate-900/50 border-slate-800 hover:border-slate-600'}`}>
              <div className="flex items-start gap-4">
                <button onClick={onToggle} className={`mt-0.5 flex-shrink-0 w-6 h-6 rounded-md border-2 flex items-center justify-center transition-colors shadow-sm active:scale-90 ${checked ? 'bg-emerald-500 border-emerald-500 text-slate-950 shadow-[0_0_10px_rgba(16,185,129,0.3)]' : isWorkout ? 'border-amber-500/50 text-transparent' : 'border-slate-600 text-transparent'}`}>
                  {checked && <Check className="w-4 h-4 text-slate-950" strokeWidth={3} />}
                </button>
                <div className="flex-1 min-w-0 cursor-pointer" onClick={onToggle}>
                  <div className="flex flex-col mb-1">
                    <h3 className={`font-bold text-sm transition-colors ${checked ? 'text-slate-500 line-through' : isWorkout ? 'text-amber-500' : 'text-slate-200'}`}>{task.name}</h3>
                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md inline-block mt-1.5 w-max tracking-wider ${checked ? 'bg-slate-800 text-slate-500' : 'bg-amber-500/10 text-amber-500 border border-amber-500/20'}`}>{task.dose}</span>
                  </div>
                  <p className={`text-xs mt-1.5 leading-relaxed ${checked ? 'text-slate-600' : 'text-slate-400'}`}>{task.note}</p>
                </div>
                
                <div className="flex flex-col gap-2">
                  {!isWorkout && (
                    <a href={getShopLink(task.name)} target="_blank" rel="noopener noreferrer" onClick={(e) => e.stopPropagation()} className="flex-shrink-0 p-1.5 rounded-full transition-colors active:scale-90 text-slate-400 bg-slate-800 hover:text-emerald-400 flex items-center justify-center shadow-sm border border-slate-700 hover:border-emerald-500/30">
                        <ShoppingCart className="w-4 h-4" />
                    </a>
                  )}
                  <button onClick={(e) => { e.stopPropagation(); onToggleInfo(); }} className={`flex-shrink-0 p-1.5 rounded-full transition-colors active:scale-90 ${isExpanded ? 'bg-amber-500 text-slate-950 shadow-[0_0_10px_rgba(245,158,11,0.4)]' : 'text-slate-400 bg-slate-800 hover:text-amber-500 shadow-sm border border-slate-700 hover:border-amber-500/30'}`}>
                    <Info className="w-4 h-4" />
                  </button>
                </div>
              </div>
              <div className={`overflow-hidden transition-all duration-300 ease-in-out ${isExpanded ? 'max-h-96 opacity-100 mt-4' : 'max-h-0 opacity-0'}`}>
                <div className="bg-slate-950/50 rounded-xl p-3 border border-slate-800 shadow-inner">
                  <h4 className="text-[10px] font-black uppercase text-amber-500 tracking-widest mb-1.5">{t.theWhy}</h4>
                  <p className="text-xs text-slate-300 leading-relaxed">{task.rationale}</p>
                </div>
              </div>
            </div>
          );
        }

        function PhaseSelector({ onSelect, currentPhaseId, phases, t }) {
          const [confirmId, setConfirmId] = useState(null);

          return (
            <div className="space-y-4 px-6 pb-8">
              {phases.map(phase => {
                const isActive = phase.id === currentPhaseId;
                return (
                  <div key={phase.id} className={`bg-slate-900 border rounded-2xl p-5 shadow-xl transition-all ${isActive ? 'border-amber-500 shadow-[0_0_15px_rgba(245,158,11,0.1)]' : 'border-slate-800'}`}>
                    <div className="flex justify-between items-start mb-4">
                      <div>
                        <span className={`text-[10px] font-black uppercase tracking-widest px-2.5 py-1 rounded-md shadow-sm border ${isActive ? 'bg-amber-500/10 text-amber-500 border-amber-500/20' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>{phase.title}</span>
                        <h3 className="text-xl font-black text-slate-200 mt-3 tracking-tight">{phase.subtitle}</h3>
                      </div>
                    </div>
                    <p className="text-sm font-semibold text-slate-300 mb-2"><span className="uppercase text-[10px] font-bold tracking-wider text-amber-500 mr-2">{t.objectiveLabel}</span>{phase.objective}</p>
                    <p className="text-xs text-slate-400 italic border-l-2 border-slate-700 pl-3 mb-4">{phase.rationale}</p>
                    <ul className="space-y-2 mb-5">
                      {phase.actions.map((act, i) => (
                        <li key={i} className="text-xs text-slate-300 flex items-start gap-2">
                          <span className="text-amber-500">•</span> <span>{act}</span>
                        </li>
                      ))}
                    </ul>
                    {isActive ? (
                      <div className="w-full text-center bg-amber-500/10 text-amber-500 border border-amber-500/20 text-xs font-bold py-2 rounded-lg uppercase tracking-wider">{t.inProgress}</div>
                    ) : confirmId === phase.id ? (
                      <div className="flex gap-2 w-full animate-in fade-in duration-300">
                        <button onClick={() => setConfirmId(null)} className="flex-1 bg-slate-800 text-slate-300 text-xs font-bold py-2 rounded-lg transition-colors border border-slate-700 active:scale-95">Annulla</button>
                        <button onClick={() => { onSelect(phase.id); setConfirmId(null); }} className="flex-1 bg-amber-500 text-slate-950 text-xs font-bold py-2 rounded-lg transition-colors border border-amber-500 active:scale-95">Conferma Fase</button>
                      </div>
                    ) : (
                      <button onClick={() => { if (!currentPhaseId) { onSelect(phase.id); } else { setConfirmId(phase.id); } }} className="w-full bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-slate-200 text-xs font-bold py-2 rounded-lg transition-colors shadow-md uppercase tracking-wider border border-slate-700 hover:border-amber-500 active:scale-95">{t.startPhase}</button>
                    )}
                  </div>
                )
              })}
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<CoralApp />);
    </script>
</body>
</html>
