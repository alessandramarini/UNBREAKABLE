              s = { c:{x:50,y:25}, cv:{x:50,y:35}, p:{x:50,y:65}, s1:{x:50,y:35}, e1:{x:45,y:50}, w1:{x:45,y:65}, h1:{x:50,y:65}, k1:{x:50,y:80}, a1:{x:45,y:95}, s2:{x:50,y:35}, e2:{x:55,y:50}, w2:{x:55,y:65}, h2:{x:50,y:65}, k2:{x:50,y:80}, a2:{x:55,y:95} };
              e = { c:{x:40,y:60}, cv:{x:45,y:50}, p:{x:50,y:65}, s1:{x:45,y:50}, e1:{x:40,y:65}, w1:{x:40,y:80}, h1:{x:50,y:65}, k1:{x:50,y:80}, a1:{x:45,y:95}, s2:{x:45,y:50}, e2:{x:45,y:65}, w2:{x:45,y:80}, h2:{x:50,y:65}, k2:{x:50,y:80}, a2:{x:55,y:95} };
              instruction = { text: t('ui.gymUI.huds.fracture'), x: 75, y: 40, arrow: "" };
            } else if (type === 'hooklying') {
              s = { c:{x:20,y:90}, cv:{x:30,y:90}, p:{x:65,y:90}, s1:{x:30,y:90}, e1:{x:45,y:92}, w1:{x:55,y:92}, h1:{x:65,y:90}, k1:{x:80,y:70}, a1:{x:95,y:95}, s2:{x:30,y:90}, e2:{x:45,y:88}, w2:{x:55,y:88}, h2:{x:65,y:90}, k2:{x:80,y:70}, a2:{x:95,y:95} };
              e = { ...s, c:{x:20,y:90}, cv: { x:30, y: 90 - (breath*1.5) }, p: { x:65, y: 90 + (breath*0.5) } }; 
            }
          } else {
            s = { 
              c:{x:50,y:20}, cv:{x:50,y:30}, p:{x:50,y:55},
              s1:{x:35,y:30}, e1:{x:30,y:45}, w1:{x:35,y:55}, h1:{x:42,y:55}, k1:{x:42,y:75}, a1:{x:42,y:95},
              s2:{x:65,y:30}, e2:{x:70,y:45}, w2:{x:65,y:55}, h2:{x:58,y:55}, k2:{x:58,y:75}, a2:{x:58,y:95}
            };
            e = { ...s };

            if (type === 'rdl') {
              s = { ...s, w1:{x:35,y:60}, w2:{x:65,y:60} };
              e = { ...s, c:{x:50,y:35}, cv:{x:50,y:45}, s1:{x:35,y:45}, s2:{x:65,y:45}, w1:{x:35,y:75}, w2:{x:65,y:75} };
            } else if (type === 'squat') {
              s = { ...s, w1:{x:48,y:40}, w2:{x:52,y:40}, e1:{x:40,y:40}, e2:{x:60,y:40} };
              e = { ...s, c:{x:50,y:45}, cv:{x:50,y:55}, p:{x:50,y:80}, h1:{x:42,y:80}, h2:{x:58,y:80}, k1:{x:30,y:75}, k2:{x:70,y:75}, s1:{x:35,y:55}, s2:{x:65,y:55}, w1:{x:48,y:60}, w2:{x:52,y:60}, e1:{x:40,y:65}, e2:{x:60,y:65} };
            } else if (type === 'overhead') {
              s = { ...s, c:{x:50,y:30}, cv:{x:50,y:40}, p:{x:50,y:65}, s1:{x:35,y:40}, s2:{x:65,y:40}, h1:{x:42,y:65}, h2:{x:58,y:65}, w1:{x:35,y:40}, w2:{x:65,y:40}, e1:{x:25,y:50}, e2:{x:75,y:50}, k1:{x:42,y:80}, k2:{x:58,y:80}, a1:{x:42,y:95}, a2:{x:58,y:95} };
              e = { ...s, w1:{x:35,y:10}, w2:{x:65,y:10}, e1:{x:25,y:25}, e2:{x:75,y:25} };
            } else if (type === 'birddog') {
              s = { c:{x:50,y:60}, cv:{x:50,y:60}, p:{x:50,y:60}, s1:{x:40,y:60}, s2:{x:60,y:60}, h1:{x:42,y:60}, h2:{x:58,y:60}, e1:{x:40,y:75}, e2:{x:60,y:75}, w1:{x:40,y:90}, w2:{x:60,y:90}, k1:{x:42,y:75}, k2:{x:58,y:75}, a1:{x:42,y:90}, a2:{x:58,y:90} };
              e = { ...s, w1:{x:40,y:40}, e1:{x:40,y:50}, k2:{x:70,y:60}, a2:{x:85,y:60} };
            } else if (type === 'impact') {
              e = { ...s, c:{x:50,y:25}, cv:{x:50,y:35}, p:{x:50,y:60}, s1:{x:35,y:35}, s2:{x:65,y:35}, h1:{x:42,y:60}, h2:{x:58,y:60}, k1:{x:42,y:80}, k2:{x:58,y:80}, w1:{x:35,y:65}, w2:{x:65,y:65} };
            } else if (type === 'flexion') {
              e = { ...s, c:{x:50,y:50}, cv:{x:50,y:50}, p:{x:50,y:65}, s1:{x:35,y:50}, s2:{x:65,y:50}, w1:{x:42,y:70}, w2:{x:58,y:70} };
            } else if (type === 'hooklying') {
              s = { c:{x:50,y:80}, cv:{x:50,y:80}, p:{x:50,y:80}, s1:{x:35,y:85}, s2:{x:65,y:85}, h1:{x:42,y:85}, h2:{x:58,y:85}, k1:{x:35,y:60}, k2:{x:65,y:60}, a1:{x:35,y:90}, a2:{x:65,y:90}, w1:{x:25,y:90}, w2:{x:75,y:90}, e1:{x:30,y:88}, e2:{x:70,y:88} };
              e = { ...s, c:{x:50,y:80-(breath*0.5)}, p:{x:50,y:80+(breath*0.5)} };
            }
          }

          let r = {};
          for (let key in s) {
            r[key] = { x: lerp(s[key].x, e[key].x, p), y: lerp(s[key].y, e[key].y, p) };
          }

          const isHolding = phaseKey === 'bottom_pause';

          const renderSpine = () => {
            let cp = { x: (r.p.x + r.cv.x)/2, y: (r.p.y + r.cv.y)/2 }; 
            if (type === 'hooklying' && !isFront) cp = { x: 50, y: 92 }; 
            if (type === 'birddog' && !isFront) cp = { x: 50, y: 58 }; 
            if (isFront && type !== 'hooklying' && type !== 'birddog') cp = { x: 50, y: (r.p.y + r.cv.y)/2 };

            const spineColor = isFlexion ? "#ef4444" : "#10b981"; 
            const spineClass = isFlexion ? "animate-pulse drop-shadow-[0_0_8px_rgba(239,68,68,0.9)]" : "drop-shadow-[0_0_4px_rgba(16,185,129,0.7)]";

            return (
              <path d={`M ${r.p.x} ${r.p.y} Q ${cp.x} ${cp.y} ${r.cv.x} ${r.cv.y}`} fill="none" stroke={spineColor} strokeWidth={isFront ? "5" : "4"} strokeLinecap="round" strokeDasharray={isFront ? "8 4" : "6 4"} className={spineClass} />
            );
          };

          const renderMuscleGlow = () => {
            if (!isHolding && phaseKey !== 'eccentric' && phaseKey !== 'concentric') return null;
            if (type === 'rdl' || type === 'squat') {
              return <path d={`M ${r.h1.x} ${r.h1.y} L ${r.k1.x} ${r.k1.y}`} stroke="#f59e0b" strokeWidth="12" opacity={p * 0.4} filter="blur(4px)" />;
            }
            return null;
          };

          return (
            <svg viewBox="0 0 100 100" className="w-full h-full bg-[#020617] rounded-t-xl overflow-hidden relative">
              <defs>
                 <pattern id="labGrid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="#0f172a" strokeWidth="0.5"/></pattern>
                 <linearGradient id="plateAmbra" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stopColor="#f59e0b" /><stop offset="100%" stopColor="#78350f" /></linearGradient>
                 <linearGradient id="plateGreen" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stopColor="#10b981" /><stop offset="100%" stopColor="#064e3b" /></linearGradient>
              </defs>

              <rect width="100" height="100" fill="url(#labGrid)" />
              
              {!isRest && type !== 'hooklying' && (
                <text x="3" y="8" fill="#334155" fontSize="4" fontFamily="monospace" fontWeight="bold">
                  LIFTMOR.SYS <tspan fill={isFlexion ? "#ef4444" : "#10b981"}>{isFlexion ? 'DANGER' : 'ACTIVE'}</tspan>
                </text>
              )}

              <g className="transition-all duration-75 ease-linear">
                {renderMuscleGlow()}
                
                <g stroke={isFront ? "#f8fafc" : "#334155"} strokeWidth={isFront ? "4" : "3"} strokeLinecap="round" strokeLinejoin="round">
                  <polyline points={`${r.s2.x},${r.s2.y} ${r.e2.x},${r.e2.y} ${r.w2.x},${r.w2.y}`} />
                  <polyline points={`${r.h2.x},${r.h2.y} ${r.k2.x},${r.k2.y} ${r.a2.x},${r.a2.y}`} />
                  <line x1={r.a2.x - 2} y1={r.a2.y} x2={r.a2.x + (isFront?2:4)} y2={r.a2.y} strokeWidth={isFront ? "4" : "3"} />
                </g>

                {isFront && (
                  <path d={`M ${r.s1.x} ${r.s1.y} L ${r.s2.x} ${r.s2.y} L ${r.h2.x} ${r.h2.y} L ${r.h1.x} ${r.h1.y} Z`} fill="#1e293b" stroke="#334155" strokeWidth="2" opacity="0.8" />
                )}

                {renderSpine()}

                <ellipse cx={r.c.x} cy={r.c.y} rx={isFront ? "5" : "4"} ry={isFront ? "6" : "5.5"} fill="#e2e8f0" />
                <line x1={r.cv.x} y1={r.cv.y} x2={r.c.x} y2={r.c.y + 4} stroke="#cbd5e1" strokeWidth="3.5" strokeLinecap="round" />
                <circle cx={r.p.x} cy={r.p.y} r="4.5" fill="#94a3b8" />

                <g stroke={isFlexion && !isFront ? "#ef4444" : "#f8fafc"} strokeWidth="4" strokeLinecap="round" strokeLinejoin="round">
                  <polyline points={`${r.s1.x},${r.s1.y} ${r.e1.x},${r.e1.y} ${r.w1.x},${r.w1.y}`} />
                  <polyline points={`${r.h1.x},${r.h1.y} ${r.k1.x},${r.k1.y} ${r.a1.x},${r.a1.y}`} />
                  <line x1={r.a1.x - 2} y1={r.a1.y} x2={r.a1.x + (isFront?2:5)} y2={r.a1.y} strokeWidth="4" />
                </g>

                {instruction && !isRest && !isFront && (
                  <g className="animate-in fade-in zoom-in duration-500">
                     <text x={instruction.x} y={instruction.y} fill={isFlexion ? "#ef4444" : "#38bdf8"} fontSize="4" fontWeight="900" fontFamily="monospace" textAnchor="middle">{instruction.text}</text>
                     {instruction.arrow && <path d={instruction.arrow} fill="none" stroke={isFlexion ? "#ef4444" : "#38bdf8"} strokeWidth="1" strokeLinecap="round" strokeLinejoin="round" />}
                  </g>
                )}

                {type === 'impact' && p > 0.8 && (
                  <g className="animate-ping opacity-50"><ellipse cx={r.a1.x} cy={r.a1.y} rx="15" ry="5" fill="none" stroke="#f59e0b" strokeWidth="2" /></g>
                )}

                {type === 'rdl' && (
                  <g>
                    <line x1={isFront ? r.w1.x-10 : r.w1.x - 22} y1={r.w1.y} x2={isFront ? r.w2.x+10 : r.w1.x + 22} y2={isFront ? r.w2.y : r.w1.y} stroke="#cbd5e1" strokeWidth="2.5" strokeLinecap="round" />
                    <rect x={isFront ? r.w1.x-8 : r.w1.x - 20} y={r.w1.y - 14} width="7" height="28" fill="url(#plateAmbra)" rx="2" />
                    <rect x={isFront ? r.w2.x+1 : r.w1.x + 13} y={isFront ? r.w2.y - 14 : r.w1.y - 14} width="7" height="28" fill="url(#plateAmbra)" rx="2" />
                  </g>
                )}
                
                {type === 'overhead' && (
                  <g>
                    <line x1={isFront ? r.w1.x-15 : r.w1.x - 18} y1={r.w1.y} x2={isFront ? r.w2.x+15 : r.w2.x + 18} y2={isFront ? r.w2.y : r.w1.y} stroke="#cbd5e1" strokeWidth="2.5" strokeLinecap="round" />
                    <rect x={isFront ? r.w1.x-12 : r.w1.x - 15} y={r.w1.y - 12} width="6" height="24" fill="url(#plateGreen)" rx="2" />
                    <rect x={isFront ? r.w2.x+6 : r.w2.x + 9} y={isFront ? r.w2.y - 12 : r.w2.y - 12} width="6" height="24" fill="url(#plateGreen)" rx="2" />
                  </g>
                )}
                
                {type === 'squat' && (
                  <g>
                    <path d={`M ${(r.w1.x+r.w2.x)/2-5} ${r.w1.y-1} A 5 5 0 0 1 ${(r.w1.x+r.w2.x)/2+5} ${r.w1.y-1}`} fill="none" stroke="#cbd5e1" strokeWidth="2.5" />
                    <circle cx={(r.w1.x+r.w2.x)/2} cy={r.w1.y + 6} r="7.5" fill="#1e293b" />
                  </g>
                )}
              </g>

              <line x1="0" y1="95" x2="100" y2="95" stroke="#334155" strokeWidth="1" />

              {isRest && (
                <g className="animate-in fade-in zoom-in duration-500">
                   <rect x="20" y="30" width="60" height="30" fill="#020617" opacity="0.9" rx="4" stroke="#38bdf8" />
                   <text x="50" y="42" fill="#38bdf8" fontSize="5" fontWeight="bold" textAnchor="middle" tracking="wider">{t('ui.gymUI.phases.rest').toUpperCase()}</text>
                   <text x="50" y="55" fill="#f8fafc" fontSize="12" fontFamily="monospace" fontWeight="900" textAnchor="middle">{Math.ceil(restTimeLeft)}<tspan fontSize="6" fill="#64748b">s</tspan></text>
                </g>
              )}
            </svg>
          );
        };

        const GymPlayer = ({ item, lang, t }) => {
          const [isPlaying, setIsPlaying] = useState(false);
          const [currentTime, setCurrentTime] = useState(0); 
          const [view, setView] = useState('side');
          const animationRef = useRef(null);
          const lastTimeRef = useRef(null);

          const tempoStr = item.tempo || '3-0-1-0';
          const repsStr = item.reps || '5';
          const restStr = item.rest || '120 Sec';

          let ecc = 3, p1 = 0, con = 1, p2 = 0;
          let isStatic = false;
          
          if (tempoStr.includes('-')) {
            const parts = tempoStr.split('-');
            ecc = parseFloat(parts[0]) || 3; p1 = parseFloat(parts[1]) || 0; con = parseFloat(parts[2]) || 1; p2 = parseFloat(parts[3]) || 0;
          } else if (tempoStr === 'Explosive') {
            ecc = 1; p1 = 0; con = 0.2; p2 = 0.5;
          } else {
            isStatic = true;
            ecc = 4; p1 = 0; con = 4; p2 = 0; 
          }
          
          const numRepsMatch = repsStr.match(/\d+/);
          const numReps = numRepsMatch ? parseInt(numRepsMatch[0]) : 1;
          const restMatch = restStr.match(/\d+/);
          const restSecs = restMatch ? parseInt(restMatch[0]) : 0;
          
          const repTime = isStatic ? 8 : (ecc + p1 + con + p2);
          const activeTime = repsStr.includes('Min') ? numReps * 60 : numReps * repTime;
          const totalSetTime = activeTime + restSecs;

          const animate = (timestamp) => {
            if (!lastTimeRef.current) lastTimeRef.current = timestamp;
            const delta = (timestamp - lastTimeRef.current) / 1000;
            lastTimeRef.current = timestamp;

            setCurrentTime(prev => {
              const next = prev + delta;
              if (next >= totalSetTime) {
                setIsPlaying(false);
                lastTimeRef.current = null;
                return 0; 
              }
              return next;
            });
            
            if (isPlaying) {
              animationRef.current = requestAnimationFrame(animate);
            }
          };

          useEffect(() => {
            if (isPlaying) {
              lastTimeRef.current = performance.now();
              animationRef.current = requestAnimationFrame(animate);
            } else {
              cancelAnimationFrame(animationRef.current);
              lastTimeRef.current = null;
            }
            return () => cancelAnimationFrame(animationRef.current);
          }, [isPlaying]);

          let p = 0;
          let phaseKey = 'ready';
          let currentRepDisplay = 1;
          let restTimeLeft = 0;

          if (currentTime < activeTime) {
             if (isStatic) {
                p = (currentTime % 8) / 8; phaseKey = 'breathing'; currentRepDisplay = 1;
             } else {
                const repElapsed = currentTime % repTime;
                currentRepDisplay = Math.min(numReps, Math.floor(currentTime / repTime) + 1);
                if (repElapsed < ecc) { p = repElapsed / ecc; phaseKey = 'eccentric'; }
                else if (repElapsed < ecc + p1) { p = 1; phaseKey = 'bottom_pause'; }
                else if (repElapsed < ecc + p1 + con) { p = 1 - ((repElapsed - ecc - p1) / con); phaseKey = 'concentric'; }
                else { p = 0; phaseKey = 'top_pause'; }
             }
          } else {
             p = 0; phaseKey = 'rest'; currentRepDisplay = numReps; restTimeLeft = totalSetTime - currentTime;
          }

          const formatTime = (secs) => {
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
          };

          const getSliderColor = () => {
            if(phaseKey === 'rest') return 'accent-sky-500';
            if(phaseKey === 'concentric') return 'accent-emerald-500';
            if(phaseKey === 'bottom_pause') return 'accent-red-500';
            return 'accent-amber-500';
          };

          return (
            <div className="w-full mt-4 rounded-xl border border-slate-700 bg-[#020617] overflow-hidden shadow-inner flex flex-col">
              <div className="relative w-full h-56 sm:h-64 border-b border-slate-800">
                <GymVisuals type={item.visual} progress={p} phaseKey={phaseKey} currentRep={currentRepDisplay} totalReps={numReps} restTimeLeft={restTimeLeft} lang={lang} t={t} view={view} />
                
                <div className={`absolute top-3 right-3 px-3 py-1.5 rounded-lg text-[10px] font-mono border uppercase tracking-wider shadow-lg flex items-center gap-2 backdrop-blur-md transition-colors duration-300
                   ${phaseKey === 'rest' ? 'bg-sky-950/80 text-sky-400 border-sky-900/50' : phaseKey === 'concentric' ? 'bg-emerald-950/80 text-emerald-400 border-emerald-900/50' : phaseKey === 'bottom_pause' ? 'bg-red-950/80 text-red-400 border-red-900/50' : 'bg-amber-950/80 text-amber-500 border-amber-900/50'}`}
                >
                  {phaseKey === 'bottom_pause' && <div className="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>}
                  {phaseKey === 'concentric' && <div className="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></div>}
                  {t(`ui.gymUI.phases.${phaseKey}`)}
                </div>
              </div>
              
              <div className="p-4 bg-slate-900/80 flex flex-col gap-3">
                <div className="flex items-center justify-between">
                   <div className="w-full h-1 bg-slate-800 rounded-full flex overflow-hidden opacity-50 mb-1 flex-1">
                      <div style={{width: `${(activeTime/totalSetTime)*100}%`}} className="h-full bg-amber-500 border-r border-slate-900"></div>
                      <div style={{width: `${(restSecs/totalSetTime)*100}%`}} className="h-full bg-sky-500"></div>
                   </div>
                   <button onClick={() => setView(v => v === 'side' ? 'front' : 'side')} className="ml-4 flex items-center gap-1.5 text-[10px] uppercase font-bold text-slate-400 hover:text-amber-500 transition-colors border border-slate-700 hover:border-amber-500/50 px-2 py-1 rounded-md bg-slate-800">
                      <Eye className="w-3.5 h-3.5" /> {view === 'side' ? t('ui.viewSide') : t('ui.viewFront')}
                   </button>
                </div>

                <div className="flex justify-between text-[11px] text-slate-500 font-mono px-1">
                   <span>REP {currentRepDisplay} / {numReps}</span>
                   <span className="text-slate-300 font-bold">{formatTime(currentTime)} <span className="text-slate-600 font-normal">/ {formatTime(totalSetTime)}</span></span>
                </div>
                
                <div className="flex items-center gap-5">
                  <button onClick={() => setIsPlaying(!isPlaying)} className={`w-12 h-12 rounded-full flex items-center justify-center transition-all shadow-lg flex-shrink-0 focus:outline-none ${isPlaying ? 'bg-slate-800 text-amber-500 border border-slate-700 hover:bg-slate-700' : 'bg-amber-500 text-slate-950 hover:bg-amber-400 shadow-[0_0_15px_rgba(245,158,11,0.4)]'}`}>
                    {isPlaying ? <Pause className="w-5 h-5 fill-current" /> : <Play className="w-5 h-5 fill-current ml-1" />}
                  </button>
                  <div className="flex-1 flex items-center relative group">
                    <input type="range" min="0" max={totalSetTime} step="0.1" value={currentTime} onChange={(e) => { setIsPlaying(false); setCurrentTime(parseFloat(e.target.value)); }} className={`w-full h-3 bg-slate-800 rounded-lg appearance-none cursor-pointer focus:outline-none ${getSliderColor()} transition-colors duration-300 hover:h-4`} />
                  </div>
                </div>
              </div>
            </div>
          );
        };

        function UnbreakableApp() {
          const { t, lang, setLang } = useI18n('en');
          
          const [habitsState, setHabitsState] = useState([
            { id: 'h1', completed: false, streak: 12 }, { id: 'h2', completed: false, streak: 8 },
            { id: 'h3', completed: false, streak: 5 }, { id: 'h4', completed: false, streak: 15 }, { id: 'h5', completed: false, streak: 10 }
          ]);

          const [activeTab, setActiveTab] = useState('gym');
          const [score, setScore] = useState(2450);
          const [showLevelUp, setShowLevelUp] = useState(false);
          const [isLangDropdownOpen, setIsLangDropdownOpen] = useState(false);
          const dropdownRef = useRef(null);

          useEffect(() => {
            const handleClickOutside = (event) => { if (dropdownRef.current && !dropdownRef.current.contains(event.target)) setIsLangDropdownOpen(false); };
            document.addEventListener('mousedown', handleClickOutside);
            return () => document.removeEventListener('mousedown', handleClickOutside);
          }, []);

          const currentLangObj = LANGUAGES.find(l => l.code === lang) || LANGUAGES[0];

          const Header = () => (
            <div className="pt-8 pb-6 px-6 bg-gradient-to-b from-slate-900 to-slate-950 border-b border-amber-900/30 sticky top-0 z-20">
              <div className="flex justify-between items-start mb-6">
                <div>
                  <h1 className="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-200 to-amber-600 tracking-tighter uppercase">{t('ui.title')}</h1>
                  <p className="text-slate-400 text-sm font-medium tracking-widest uppercase mt-1">{t('ui.subtitle')}</p>
                </div>
                <div className="relative" ref={dropdownRef}>
                  <button onClick={() => setIsLangDropdownOpen(!isLangDropdownOpen)} className="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 transition-colors border border-slate-700 px-3 py-1.5 rounded-xl text-xs font-bold text-slate-300 shadow-md">
                    <span className="text-base">{currentLangObj.flag}</span>
                    <span className="uppercase">{currentLangObj.code}</span>
                    <ChevronDown className={`w-3 h-3 text-amber-500 transition-transform ${isLangDropdownOpen ? 'rotate-180' : ''}`} />
                  </button>
                  {isLangDropdownOpen && (
                    <div className="absolute top-full right-0 mt-2 w-40 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl overflow-hidden z-50">
                      {LANGUAGES.map((language) => (
                        <button key={language.code} onClick={() => { setLang(language.code); setIsLangDropdownOpen(false); }} className={`w-full text-left px-4 py-2.5 text-sm flex items-center gap-3 hover:bg-slate-700 transition-colors ${lang === language.code ? 'bg-slate-700/80 text-amber-400 font-bold' : 'text-slate-300'}`}>
                          <span className="text-base">{language.flag}</span>{language.label}
                        </button>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          );

          const GymView = () => {
            const [gymTab, setGymTab] = useState('liftmor');
            const items = GYM_DATA[gymTab] || [];
            
            return (
              <div className="p-6 space-y-6 pb-24 animate-in fade-in slide-in-from-bottom-4 duration-500">
                <div className="flex items-center gap-2 mb-2">
                  <Dumbbell className="text-amber-500 h-5 w-5" />
                  <h2 className="text-xl font-bold text-white">{t('ui.gymUI.title')}</h2>
                </div>
                <p className="text-xs text-slate-400 mb-6">{t('ui.gymUI.desc')}</p>

                <div className="flex bg-slate-900 rounded-xl p-1 border border-slate-800 mb-6 shadow-inner">
                  {['daily', 'liftmor', 'redlines'].map((p) => (
                    <button key={p} onClick={() => setGymTab(p)} className={`flex-1 py-3 text-[11px] font-bold rounded-lg transition-all duration-300 ${gymTab === p ? 'bg-amber-500 text-slate-900 shadow-md shadow-amber-900/20' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`}>
                      {t(`ui.gymUI.tabs.${p}`)}
                    </button>
                  ))}
                </div>

                <div className="space-y-8">
                  {items.map((item, idx) => (
                    <div key={idx} className={`bg-slate-900 border rounded-3xl p-1 shadow-xl overflow-hidden relative group ${gymTab === 'redlines' ? 'border-red-900/50' : 'border-slate-800'}`}>
                      <div className="p-5 relative z-10">
                        <div className="flex gap-4 items-start mb-5">
                          <div className={`p-3 rounded-2xl bg-slate-950 border shadow-inner flex-shrink-0 ${gymTab === 'redlines' ? 'border-red-900/50' : 'border-slate-700/50'}`}><Activity className="w-5 h-5 text-amber-500"/></div>
                          <div className="flex-1">
                            <h4 className={`text-lg font-black tracking-wide mb-1.5 uppercase ${gymTab === 'redlines' ? 'text-red-500' : 'text-amber-500'}`}>{item.name}</h4>
                          </div>
                        </div>
                        
                        <div className="grid grid-cols-4 gap-2 mb-6">
                          <MetricBadge label={t('ui.gymUI.labels.sets')} value={item.sets} icon={<Layers/>} />
                          <MetricBadge label={t('ui.gymUI.labels.reps')} value={item.reps} icon={<Repeat/>} />
                          <MetricBadge label={t('ui.gymUI.labels.tempo')} value={item.tempo} icon={<Clock/>} />
                          <MetricBadge label={t('ui.gymUI.labels.rest')} value={item.rest} icon={<Timer/>} />
                        </div>
                      </div>
                      <div className="border-t border-slate-800"><GymPlayer item={item} lang={lang} t={t} /></div>
                    </div>
                  ))}
                </div>
              </div>
            );
          };

          const ForgeView = () => {
            const habits = t('habits');
            return (
              <div className="p-6 space-y-6 pb-24 animate-in fade-in slide-in-from-bottom-4 duration-500">
                <div className="bg-slate-900/80 p-5 rounded-2xl border border-slate-800">
                   <div className="flex items-center gap-2 mb-4"><Target className="text-amber-500 h-5 w-5" /><span className="text-base font-bold text-white">{t('ui.forge.title')}</span></div>
                   <div className="space-y-3">
                     {habitsState.map((h, i) => (
                       <div key={h.id} className="w-full text-left rounded-2xl p-4 border bg-slate-900/50 border-slate-800 flex items-center justify-between">
                         <div><h3 className="font-semibold text-sm text-slate-200">{Array.isArray(habits) ? habits[i]?.name : h.id}</h3></div>
                       </div>
                     ))}
                   </div>
                </div>
              </div>
            );
          };

          return (
            <div className="min-h-screen bg-slate-950 text-slate-200 font-sans selection:bg-amber-500/30 flex justify-center">
              <div className="w-full max-w-md bg-slate-950 relative shadow-2xl overflow-x-hidden min-h-screen flex flex-col">
                <Header />
                <main className="flex-1">
                  {activeTab === 'forge' && <ForgeView />}
                  {activeTab === 'gym' && <GymView />}
                </main>

                <div className="fixed bottom-0 w-full max-w-md mx-auto bg-slate-950/95 backdrop-blur-md border-t border-slate-800 px-2 py-4 pb-safe z-30 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
                  <div className="flex justify-between items-center px-1">
                    <button onClick={() => setActiveTab('forge')} className={`flex flex-col items-center gap-1.5 transition-colors flex-1 ${activeTab === 'forge' ? 'text-amber-500 scale-110' : 'text-slate-500'}`}>
                      <Activity className="h-5 w-5" /><span className="text-[9px] font-bold tracking-wider uppercase">{t('ui.protocol')}</span>
                    </button>
                    <button onClick={() => setActiveTab('gym')} className={`flex flex-col items-center gap-1.5 transition-colors flex-1 ${activeTab === 'gym' ? 'text-amber-500 scale-110' : 'text-slate-500'}`}>
                      <Dumbbell className="h-5 w-5" /><span className="text-[9px] font-bold tracking-wider uppercase">{t('ui.gym')}</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<UnbreakableApp />);
    </script>
</body>
</html>
